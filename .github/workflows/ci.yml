name: Scientific and station workflow checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    env:
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Run the example with only the required libraries
        working-directory: ${{ runner.temp }}
        shell: bash
        run: python "$GITHUB_WORKSPACE/run_rating_curve.py"
      - run: python -m pip install pytest ruff scikit-learn joblib
      - run: python -m ruff check --no-cache --select E9,F63,F7,F82 src run_rating_curve.py
      - run: python -B -m pytest src/tests -q -p no:cacheprovider
